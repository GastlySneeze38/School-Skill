[package]
name = "revisions-backend"
version = "0.1.0"
edition = "2021"

[lib]
name = "revisions_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "revisions-backend"
path = "src/main.rs"

# Développement : pas d'informations de débogage pour les bibliothèques externes
# (divise la taille du dossier de compilation), seulement les numéros de ligne pour notre code.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLite embarqué (compilé avec l'app) : rien à installer sur la machine.
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
aes = "0.9.4"
cbc = { version = "0.2.1", features = ["alloc", "block-padding"] }
md-5 = "0.11.0"
sha2 = "0.11.1"
flate2 = "1.1.11"
hex = "0.4.3"
rand = "0.10.4"
regex = "1.13.2"
scraper = "0.29.0"
urlencoding = "2.1.3"
anyhow = "1.0.105"
chrono = { version = "0.4.45", features = ["serde"] }
html-escape = "0.3.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "cookies", "rustls", "gzip", "form"] }
keyring = { version = "3", features = ["windows-native"] }
futures-util = "0.3.34"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }
